[project]
name = "max-id-bot"
version = "0.1.0"
description = "MAX-бот: показывает ID пользователей, чатов, пересланных сообщений и контактов"
requires-python = ">=3.12"
dependencies = [
    "maxapi>=1.2.1,<2", # проверенный командой MAX форк библиотеки Bot API
    "python-dotenv>=1.2.2,<2", # загрузка .env
]

[project.optional-dependencies]
# Режим webhook работает и без этой экстры: maxapi поднимает сервер на aiohttp,
# который входит в его основные зависимости. Экстра нужна только тем, кто хочет
# вместо aiohttp использовать бэкенд на FastAPI.
fastapi = ["maxapi[webhook]>=1.2.1,<2"]

[dependency-groups]
dev = [
    "ruff>=0.15.22,<0.16",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
]

[project.scripts]
max-id-bot = "bot.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.uv]
package = true

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
